<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sort Circuit — Admin</title>
<style>
:root{--void:#0B0E12;--ink:#F2F4F5;--dim:#8B939A;--line:rgba(242,244,245,.14);--acc:#7093E4;--bad:#ff7a6e;--ok:#5BC431}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:32px 20px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--dim);margin:0 0 24px}
.card{background:rgba(242,244,245,.04);border:1px solid var(--line);border-radius:14px;padding:20px}
label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 0 6px}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(242,244,245,.06);color:var(--ink);outline:none}
input:focus{border-color:var(--acc)}
button{font:inherit;font-weight:600;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(242,244,245,.08);color:var(--ink);cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#0B0E12}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.bar .grow{flex:1 1 200px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 20px}
.stats b{display:block;font-size:28px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats span{color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
td.n{color:var(--dim)}
td.s{font-weight:700}
tr.first td.s{color:#EFCC5A}
td.act{text-align:right}
td.act button{padding:5px 10px;font-size:13px}
.msg{min-height:1.4em;margin:12px 0 0;color:var(--dim)}
.msg.bad{color:var(--bad)}
.msg.ok{color:var(--ok)}
.err-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:rgba(255,122,110,.14);border:1px solid rgba(255,122,110,.3);color:var(--bad);margin-right:6px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Sort Circuit — Leaderboard admin</h1>
  <p class="sub">Private view of every submitted score. Students never see this page. · <a href="game.html" style="color:var(--acc);text-decoration:none">Back to Game</a> · <a href="404.html" style="color:var(--dim);text-decoration:none">Error Directory</a></p>

  <section class="card" id="login">
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="pass">Password</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <div class="bar" style="margin-top:16px">
        <button class="primary" type="submit" id="loginBtn">Sign in</button>
      </div>
      <p class="msg" id="loginMsg"></p>
    </form>
  </section>

  <section class="card" id="panel" hidden>
    <div class="stats">
      <div><b id="stTotal">–</b><span>Scores</span></div>
      <div><b id="stPlayers">–</b><span>Students</span></div>
      <div><b id="stTop">–</b><span>High score</span></div>
      <div><b id="stAvg">–</b><span>Average</span></div>
    </div>
    <div class="bar">
      <input class="grow" id="q" type="search" placeholder="Search student IDs…">
      <select id="sortBy">
        <option value="score">Highest score</option>
        <option value="new">Most recent</option>
        <option value="name">Name A–Z</option>
      </select>
      <label style="margin:0;display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)">
        <input type="checkbox" id="bestOnly" style="width:auto"> Best per student
      </label>
      <button id="refresh">Refresh</button>
      <button id="csv">Download CSV</button>
      <button id="logout">Sign out</button>
    </div>
    <table>
      <thead><tr><th>#</th><th>Student ID</th><th>Score</th><th>Mode</th><th>Submitted</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="msg" id="msg"></p>
  </section>
</main>

<script>
/* ══ error system & codes ══════════════════════════════════════════ */
class SCError extends Error {
  constructor(code, message, cause=null){
    super(message);
    this.name='SCError';
    this.code=code;
    this.cause=cause;
  }
}
const ERROR_CODES = {
  ERR_AUTH_INVALID:    { code:'SC-AUTH-001', message:'Invalid email or password.' },
  ERR_AUTH_EXPIRED:    { code:'SC-AUTH-002', message:'Session expired — please sign in again.' },
  ERR_AUTH_REFRESH:    { code:'SC-AUTH-003', message:'Failed to refresh authentication session token.' },
  ERR_AUTH_FORBIDDEN:  { code:'SC-AUTH-004', message:'Access forbidden — insufficient database permissions.' },
  ERR_CONFIG_MISSING:  { code:'SC-CFG-001',  message:'Supabase URL or key not configured in this file yet.' },
  ERR_LEADERBOARD_LOAD:{ code:'SC-DATA-002', message:'Failed to load leaderboard scores.' },
  ERR_SCORE_DELETE:    { code:'SC-DATA-003', message:'Failed to delete score from leaderboard.' },
  ERR_CSV_EXPORT:      { code:'SC-DATA-005', message:'Failed to generate or download CSV export.' },
  ERR_NOT_FOUND:       { code:'SC-ROUTER-404',message:'API endpoint not found.' },
  ERR_RATE_LIMIT:      { code:'SC-NET-004',  message:'Too many requests. Please wait a moment.' },
  ERR_NET_UNREACHABLE: { code:'SC-NET-002',  message:'Leaderboard service unreachable — check connection.' },
  ERR_SYS_RUNTIME:     { code:'SC-SYS-001',  message:'An unexpected runtime error occurred.' }
};
function scError(key, msg='', cause=null){
  const item = ERROR_CODES[key] || { code:'SC-SYS-001', message:msg||'Unexpected error' };
  return new SCError(item.code, msg || item.message, cause);
}
function formatErrorHtml(err, fallbackKey='ERR_SYS_RUNTIME'){
  let code = (err && err.code) ? err.code : '';
  let msg = (err && err.message) ? err.message : String(err||'Unknown error');

  if(!code){
    if(/invalid login|invalid_grant|invalid credentials/i.test(msg)){ code='SC-AUTH-001'; msg='Invalid email or password.'; }
    else if(/session expired|jwt expired|token expired|401/i.test(msg)){ code='SC-AUTH-002'; msg='Session expired — please sign in again.'; }
    else if(/failed to fetch|network|offline/i.test(msg)){ code='SC-NET-002'; msg='Could not connect to Supabase — check network.'; }
    else if(/404/i.test(msg)){ code='SC-ROUTER-404'; msg='Resource not found.'; }
    else if(/429|rate limit/i.test(msg)){ code='SC-NET-004'; msg='Rate limit exceeded. Please wait a moment.'; }
    else if(/permission|row level security|rls|403/i.test(msg)){ code='SC-AUTH-004'; msg='Access denied by database security policy.'; }
    else { const fb = ERROR_CODES[fallbackKey] || ERROR_CODES.ERR_SYS_RUNTIME; code=fb.code; }
  }
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<span class="err-badge" title="Click to view in Error Directory" onclick="window.open('404.html#'+'${code}','_blank')">${code}</span><span>${esc(msg)}</span>`;
}

// Same project as the game. The anon key is public; access is gated by your Supabase Auth login + RLS.
const SUPABASE={ url:'', key:'' };
const TOKEN_KEY='sc:admin:session';
const $=id=>document.getElementById(id);

let session=null;
try{ session=JSON.parse(localStorage.getItem(TOKEN_KEY)||'null'); }catch(e){}

async function api(path,opts={},auth=true){
  let res;
  try{
    res=await fetch(SUPABASE.url+path,{...opts,headers:{
      apikey:SUPABASE.key,
      Authorization:'Bearer '+(auth&&session?session.access_token:SUPABASE.key),
      'Content-Type':'application/json', ...(opts.headers||{}) }});
  }catch(netErr){
    throw scError('ERR_NET_UNREACHABLE', 'Could not reach Supabase service: '+netErr.message, netErr);
  }
  if(res.status===401&&auth){ signOut(); throw scError('ERR_AUTH_EXPIRED'); }
  if(res.status===403){ throw scError('ERR_AUTH_FORBIDDEN'); }
  if(res.status===404){ throw scError('ERR_NOT_FOUND', `Resource not found: ${path}`); }
  if(res.status===429){ throw scError('ERR_RATE_LIMIT'); }
  if(!res.ok){
    let t=await res.text();
    try{ t=JSON.parse(t).msg||JSON.parse(t).message||JSON.parse(t).error_description||t; }catch(e){}
    throw new SCError('SC-DATA-002', t);
  }
  return res.status===204?null:res.json();
}

async function signIn(email,password){
  const s=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})},false);
  session={access_token:s.access_token,refresh_token:s.refresh_token,expires_at:Date.now()+s.expires_in*1000};
  localStorage.setItem(TOKEN_KEY,JSON.stringify(session));
}
async function refreshSession(){
  if(!session) return false;
  if(Date.now()<session.expires_at-60000) return true;
  try{
    const s=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})},false);
    session={access_token:s.access_token,refresh_token:s.refresh_token,expires_at:Date.now()+s.expires_in*1000};
    localStorage.setItem(TOKEN_KEY,JSON.stringify(session)); return true;
  }catch(e){ signOut(); return false; }
}
function signOut(){ session=null; localStorage.removeItem(TOKEN_KEY); $('panel').hidden=true; $('login').hidden=false; }

let all=[];
async function load(){
  if(!await refreshSession()){
    $('msg').className='msg bad'; $('msg').innerHTML=formatErrorHtml(scError('ERR_AUTH_EXPIRED'));
    return;
  }
  $('msg').className='msg'; $('msg').textContent='Loading…';
  try{
    all=[]; let from=0;
    for(;;){ // page through everything
      const page=await api(`/rest/v1/scores?select=id,name,score,mode,created_at&order=score.desc,created_at.asc`,{headers:{Range:`${from}-${from+999}`}});
      all.push(...page); if(page.length<1000) break; from+=1000;
    }
    render(); $('msg').textContent=`Updated ${new Date().toLocaleTimeString()}`;
  }catch(e){ $('msg').className='msg bad'; $('msg').innerHTML=formatErrorHtml(e, 'ERR_LEADERBOARD_LOAD'); }
}

function view(){
  const q=$('q').value.trim().toLowerCase();
  let rows=all.filter(r=>!q||r.name.toLowerCase().includes(q));
  if($('bestOnly').checked){
    const seen=new Map();
    for(const r of rows){ const k=r.name.trim().toLowerCase(); if(!seen.has(k)||seen.get(k).score<r.score) seen.set(k,r); }
    rows=[...seen.values()];
  }
  const by=$('sortBy').value;
  rows.sort((a,b)=> by==='new' ? b.created_at.localeCompare(a.created_at)
                 : by==='name' ? a.name.localeCompare(b.name)||b.score-a.score
                 : b.score-a.score||a.created_at.localeCompare(b.created_at));
  return rows;
}

function render(){
  const players=new Set(all.map(r=>r.name.trim().toLowerCase())).size;
  $('stTotal').textContent=all.length; $('stPlayers').textContent=players;
  $('stTop').textContent=all.length?Math.max(...all.map(r=>r.score)):'–';
  $('stAvg').textContent=all.length?(all.reduce((s,r)=>s+r.score,0)/all.length).toFixed(1):'–';
  const tb=$('rows'); tb.innerHTML='';
  const rows=view();
  if(!rows.length){ tb.innerHTML='<tr><td colspan="6" style="color:var(--dim)">No scores yet.</td></tr>'; return; }
  rows.forEach((r,i)=>{
    const tr=document.createElement('tr'); if(i===0&&$('sortBy').value==='score') tr.className='first';
    const cells=[['n',i+1],['',r.name],['s',r.score],['n',r.mode],['n',new Date(r.created_at).toLocaleString()]];
    for(const [c,v] of cells){ const td=document.createElement('td'); td.className=c; td.textContent=v; tr.appendChild(td); }
    const act=document.createElement('td'); act.className='act';
    const del=document.createElement('button'); del.className='danger'; del.textContent='Delete';
    del.onclick=async()=>{
      if(!confirm(`Delete ${r.name} — ${r.score}?`)) return;
      del.disabled=true;
      try{ await api(`/rest/v1/scores?id=eq.${r.id}`,{method:'DELETE'}); all=all.filter(x=>x.id!==r.id); render(); }
      catch(e){ $('msg').className='msg bad'; $('msg').innerHTML=formatErrorHtml(e, 'ERR_SCORE_DELETE'); del.disabled=false; }
    };
    act.appendChild(del); tr.appendChild(act); tb.appendChild(tr);
  });
}

function csv(){
  try{
    const esc=v=>`"${String(v).replace(/"/g,'""')}"`;
    const lines=[['rank','name','score','mode','submitted'].join(',')];
    view().forEach((r,i)=>lines.push([i+1,esc(r.name),r.score,r.mode,r.created_at].join(',')));
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));
    a.download=`sort-circuit-scores-${new Date().toISOString().slice(0,10)}.csv`; a.click();
    URL.revokeObjectURL(a.href);
  }catch(e){
    $('msg').className='msg bad';
    $('msg').innerHTML=formatErrorHtml(scError('ERR_CSV_EXPORT', 'Failed to generate CSV export: '+e.message, e));
  }
}

$('loginForm').addEventListener('submit',async ev=>{
  ev.preventDefault(); $('loginBtn').disabled=true; $('loginMsg').className='msg'; $('loginMsg').textContent='Signing in…';
  try{ await signIn($('email').value.trim(),$('pass').value); $('loginMsg').textContent=''; $('login').hidden=true; $('panel').hidden=false; await load(); }
  catch(e){ $('loginMsg').className='msg bad'; $('loginMsg').innerHTML=formatErrorHtml(e, 'ERR_AUTH_INVALID'); }
  $('loginBtn').disabled=false;
});
$('logout').onclick=signOut;
$('refresh').onclick=load;
$('csv').onclick=csv;
for(const id of ['q','sortBy','bestOnly']) $(id).addEventListener('input',render);
setInterval(()=>{ if(session&&!document.hidden) load(); },30000);

if(!/^https?:/.test(SUPABASE.url)||SUPABASE.key.startsWith('__')){
  $('loginMsg').className='msg bad'; $('loginMsg').innerHTML=formatErrorHtml(scError('ERR_CONFIG_MISSING'));
}else if(session){ $('login').hidden=true; $('panel').hidden=false; load(); }
</script>
</body>
</html>
